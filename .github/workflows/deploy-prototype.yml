# Deploy the Next.js site to GitHub Pages
# Live URL: https://mirajin9.github.io/Society-Evergreen-website/
#
# One-time setup: Settings → Pages → Source → "GitHub Actions"
#
# IMPORTANT: Real member data (data.jsx) is NEVER deployed.
# data.demo.jsx (12 fictional members) is used instead.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Use demo data (real data.jsx never deployed)
        run: cp data.demo.jsx data.jsx

      - name: Remove server-only API routes
        run: rm -rf app/api

      - name: Write static-export Next.js config
        run: |
          cat > next.config.mjs << 'NEXTCONFIG'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            reactStrictMode: true,
            output: "export",
            basePath: "/Society-Evergreen-website",
            trailingSlash: true,
            images: { unoptimized: true },
          };
          export default nextConfig;
          NEXTCONFIG
          echo "next.config.mjs written:"
          cat next.config.mjs

      - name: Build
        run: npm run build

      - name: Verify output
        run: |
          ls -la out/
          test -f out/index.html && echo "index.html OK" || (echo "index.html MISSING" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
