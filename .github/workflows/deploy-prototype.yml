# Deploy the Next.js prototype to GitHub Pages
# URL: https://mirajin9.github.io/Society-Evergreen-website/
#
# One-time setup: Settings → Pages → Source → "GitHub Actions"
#
# IMPORTANT: Real member data (data.jsx) is NEVER deployed.
# The public demo uses data.demo.jsx — 12 named fictional members + 153 numbered
# placeholders. All emails @example.com, all names clearly fictional.
# Admin login: flat 111 / admin4321   |   Member login: any flat / admin123

name: Deploy Prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Swap in demo data (real data.jsx is NEVER deployed)
        run: cp data.demo.jsx data.jsx

      - name: Remove API routes (not supported in static export)
        run: rm -rf app/api

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "true"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
